backend:
  name: github
  repo: "jeff397/Villers"
  branch: main

media_folder: "public/documents/actualites"
public_folder: "/documents/actualites"

collections:
  # =========================================================================
  # 1. COLLECTION ACTUALITÉS
  # =========================================================================
  - name: "actualites"
    label: "Actualités"
    folder: "src/data/actualites"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre de l'article", name: "title", widget: "string" }
      - label: "Catégorie"
        name: "category"
        widget: "select"
        options: ["Travaux", "Événement", "Vie Locale"]
      - label: "Date de l'événement / publication"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
      - { label: "Image d'illustration", name: "image", widget: "image" }
      - { label: "Description / Contenu court", name: "desc", widget: "text" }
      - {
          label: "Texte Complet (S'affiche dans la Pop-up)",
          name: "body",
          widget: "markdown",
          required: false,
        }

  # =========================================================================
  # 2. COLLECTION ÉTAT CIVIL (VIE DE LA COMMUNE)
  # =========================================================================
  - name: "registre_commune"
    label: "Vie de la commune (État Civil)"
    delete: false
    files:
      - name: "vie_commune_data"
        label: "Registre de l'État Civil"
        file: "src/data/vieCommune.json"
        format: "json"
        fields:
          - label: "Années enregistrées"
            name: "registre"
            widget: "list"
            summary: "Année {{fields.annee}}"
            fields:
              - { label: "Année (ex: 2026)", name: "annee", widget: "string" }

              # SECTION NAISSANCES
              - label: "Nombre de Naissances"
                name: "naissances_count"
                widget: "number"
                value_type: "int"
                default: 0
                required: false

              # SECTION MARIAGES
              - label: "Mariages"
                name: "mariages"
                widget: "list"
                required: false
                fields:
                  - { label: "Nom Époux(se) 1", name: "nom1", widget: "string" }
                  - {
                      label: "Prénom Époux(se) 1",
                      name: "prenom1",
                      widget: "string",
                    }
                  - { label: "Nom Époux(se) 2", name: "nom2", widget: "string" }
                  - {
                      label: "Prénom Époux(se) 2",
                      name: "prenom2",
                      widget: "string",
                    }
                  - {
                      label: "Date (JJ/MM/AAAA)",
                      name: "date",
                      widget: "string",
                    }

              # SECTION PACS
              - label: "PACS"
                name: "pacs"
                widget: "list"
                required: false
                fields:
                  - {
                      label: "Nom Partenaire 1",
                      name: "nom1",
                      widget: "string",
                    }
                  - {
                      label: "Prénom Partenaire 1",
                      name: "prenom1",
                      widget: "string",
                    }
                  - {
                      label: "Nom Partenaire 2",
                      name: "nom2",
                      widget: "string",
                    }
                  - {
                      label: "Prénom Partenaire 2",
                      name: "prenom2",
                      widget: "string",
                    }
                  - {
                      label: "Date (JJ/MM/AAAA)",
                      name: "date",
                      widget: "string",
                    }

              # SECTION DÉCÈS
              - label: "Décès"
                name: "deces"
                widget: "list"
                required: false
                fields:
                  - { label: "Nom", name: "nom", widget: "string" }
                  - { label: "Prénom", name: "prenom", widget: "string" }
                  - {
                      label: "Date (JJ/MM/AAAA)",
                      name: "date",
                      widget: "string",
                    }

  # =========================================================================
  # 3. COLLECTION VIE SOLIDAIRE (STATISTIQUES)
  # =========================================================================
  - name: "vie_solidaire"
    label: "Vie Solidaire (Statistiques)"
    delete: false
    files:
      - name: "vie_solidaire_data"
        label: "Registre de la Vie Solidaire"
        file: "src/data/vieSolidaire.json"
        format: "json"
        fields:
          - label: "Historique par Année"
            name: "registre"
            widget: "list"
            summary: "Statistiques {{fields.annee}}"
            fields:
              - { label: "Année (ex: 2026)", name: "annee", widget: "string" }

              # BLOC JEUNESSE
              - label: "👦 Actions Jeunesse"
                name: "jeunesse"
                widget: "object"
                fields:
                  - label: "Entrées en 6ème (Nombre d'élèves)"
                    name: "entree6eme_nombre"
                    widget: "number"
                    value_type: "int"
                    default: 0
                  - label: "Diplômés fêtés (Nombre)"
                    name: "diplomes_nombre"
                    widget: "number"
                    value_type: "int"
                    default: 0
                  - label: "Jouets de Noël distribués (Nombre)"
                    name: "noel_nombreJouets"
                    widget: "number"
                    value_type: "int"
                    default: 0

              # BLOC AÎNÉS
              - label: "👵 Actions Aînés"
                name: "aines"
                widget: "object"
                fields:
                  - label: "Colis distribués aux 65 ans et +"
                    name: "plusDe65ans_total"
                    widget: "number"
                    value_type: "int"
                    default: 0
                  - label: "Colis distribués aux 60 - 64 ans"
                    name: "de60a64ans_total"
                    widget: "number"
                    value_type: "int"
                    default: 0

  # =========================================================================
  # 4. COLLECTION VIE ASSOCIATIVE
  # =========================================================================
  - name: "vie_associative"
    label: "Vie Associative"
    delete: false
    files:
      - name: "associations_list"
        label: "Liste des Associations"
        file: "src/data/associations.json"
        format: "json"
        fields:
          - label: "Associations enregistrées"
            name: "associations"
            widget: "list"
            summary: "{{fields.nom}} ({{fields.categorie}})"
            fields:
              - { label: "Nom de l'association", name: "nom", widget: "string" }
              - label: "Catégorie"
                name: "categorie"
                widget: "select"
                options:
                  ["Loisirs", "Social", "Nature & Loisirs", "Sport", "Culture"]
              - {
                  label: "Description courte (S'affiche sur la carte)",
                  name: "description",
                  widget: "text",
                }
              - {
                  label: "Nom du/de la Président(e)",
                  name: "president",
                  widget: "string",
                }
              - {
                  label: "Téléphone de contact",
                  name: "telephone",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Adresse Email",
                  name: "email",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Site Internet ou Page Facebook",
                  name: "site",
                  widget: "string",
                  required: false,
                }
              - label: "Texte de présentation détaillé (Paragraphes dans la Modale)"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraphe", widget: "text" }

  # =========================================================================
  # 5. COLLECTION ARTISANS & COMMERCES
  # =========================================================================
  - name: "artisans_commerces"
    label: "Artisans & Commerces"
    delete: false
    files:
      - name: "commerces_list"
        label: "Liste des Professionnels"
        file: "src/data/commerces.json"
        format: "json"
        fields:
          - label: "Entreprises et Artisans enregistrés"
            name: "commerces"
            widget: "list"
            summary: "{{fields.nom}} ({{fields.categorie}})"
            fields:
              - {
                  label: "Nom de l'entreprise / professionnel",
                  name: "nom",
                  widget: "string",
                }
              - label: "Catégorie"
                name: "categorie"
                widget: "select"
                options:
                  [
                    "Alimentation",
                    "Artisanat / Travaux",
                    "Services",
                    "Petite Enfance",
                    "Santé",
                  ]
              - {
                  label: "Description courte (S'affiche sur la carte)",
                  name: "description",
                  widget: "text",
                }
              - {
                  label: "Nom du contact / responsable",
                  name: "contactNom",
                  widget: "string",
                }
              - {
                  label: "Adresse physique",
                  name: "adresse",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Téléphone de contact",
                  name: "telephone",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Adresse Email",
                  name: "email",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Site Internet (ou page Facebook)",
                  name: "site",
                  widget: "string",
                  required: false,
                }
              - label: "Détails de l'activité & Horaires (Paragraphes dans la Modale)"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraphe", widget: "text" }

  # =========================================================================
  # 6. COLLECTION HÉBERGEMENTS & TOURISME
  # =========================================================================
  - name: "tourisme_hebergement"
    label: "Hébergements & Tourisme"
    delete: false
    files:
      - name: "gites_list"
        label: "Liste des Hébergements"
        file: "src/data/gites.json"
        format: "json"
        fields:
          - label: "Hébergements touristiques enregistrés"
            name: "gites"
            widget: "list"
            summary: "{{fields.nom}} ({{fields.type}})"
            fields:
              - { label: "Nom de l'hébergement", name: "nom", widget: "string" }
              - label: "Type d'hébergement"
                name: "type"
                widget: "select"
                options:
                  ["Gîte rural", "Chambre d'hôtes", "Camping", "Gîte d'étape"]
              - {
                  label: "Capacité d'accueil (ex: 4-6 personnes)",
                  name: "capacite",
                  widget: "string",
                }
              - {
                  label: "Description de l'hébergement",
                  name: "description",
                  widget: "text",
                }
              - {
                  label: "Image d'illustration (Optionnel)",
                  name: "image",
                  widget: "image",
                  required: false,
                }
              - {
                  label: "Téléphone de réservation",
                  name: "telephone",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Adresse Email",
                  name: "email",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Site Internet (ou lien Airbnb/Gîtes de France)",
                  name: "siteWeb",
                  widget: "string",
                  required: false,
                }

  # =========================================================================
  # 7. COLLECTION CADRE DE VIE & VOISINAGE
  # =========================================================================
  - name: "cadre_de_vie"
    label: "Cadre de vie & Voisinage"
    delete: false
    files:
      - name: "voisinage_list"
        label: "Règlements & Fiches Pratiques"
        file: "src/data/reglementsVoisinage.json"
        format: "json"
        fields:
          - label: "Fiches de bon voisinage enregistrées"
            name: "reglements"
            widget: "list"
            summary: "{{fields.titre}}"
            fields:
              - {
                  label: "Identifiant unique (ex: frelons, bruit)",
                  name: "id",
                  widget: "string",
                }
              - label: "Icône Lucide"
                name: "icone"
                widget: "select"
                options:
                  [
                    "ShieldAlert",
                    "Volume2",
                    "TreePine",
                    "Key",
                    "Mail",
                    "Info",
                    "HelpCircle",
                  ]
              - {
                  label: "Titre de la thématique",
                  name: "titre",
                  widget: "string",
                }
              - {
                  label: "Résumé court (Sous le titre)",
                  name: "resume",
                  widget: "string",
                }
              - {
                  label: "Note importante / Alerte (Optionnel)",
                  name: "important",
                  widget: "string",
                  required: false,
                }
              - label: "Contenu détaillé (Paragraphes)"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraphe de texte", widget: "text" }

  # =========================================================================
  # 8. CONFIGURATION DE LA SALLE DES FÊTES
  # =========================================================================
  - name: "salle_fetes_page"
    label: "Salle des Fêtes"
    delete: false
    files:
      - name: "salle_fetes_data"
        label: "Gestion de la Salle des Fêtes"
        file: "src/data/salleDesFetes.json"
        format: "json"
        fields:
          - label: "Capacité d'accueil"
            name: "capacite"
            widget: "object"
            fields:
              - {
                  label: "Nombre de places assises",
                  name: "assise",
                  widget: "number",
                  value_type: "int",
                }
              - {
                  label: "Nombre de places debout max.",
                  name: "debout",
                  widget: "number",
                  value_type: "int",
                }
              - {
                  label: "Description / Usage idéal",
                  name: "description",
                  widget: "text",
                }
          - label: "Grille Tarifaire"
            name: "tarifs"
            widget: "object"
            fields:
              - label: "Habitants de la commune"
                name: "habitantsCommune"
                widget: "object"
                fields:
                  - {
                      label: "Tarif Week-end (2 jours)",
                      name: "weekEnd",
                      widget: "string",
                    }
                  - {
                      label: "Tarif La journée en semaine",
                      name: "journee",
                      widget: "string",
                    }
              - label: "Personnes Extérieures"
                name: "exterieurs"
                widget: "object"
                fields:
                  - {
                      label: "Tarif Week-end (2 jours)",
                      name: "weekEnd",
                      widget: "string",
                    }
                  - {
                      label: "Tarif La journée en semaine",
                      name: "journee",
                      widget: "string",
                    }
              - label: "Options complémentaires"
                name: "options"
                widget: "object"
                fields:
                  - {
                      label: "Option Vaisselle",
                      name: "vaisselle",
                      widget: "string",
                    }
                  - {
                      label: "Règle pour le Chauffage / Électricité",
                      name: "chauffageElectricite",
                      widget: "string",
                    }
          - label: "Conditions & Réservation"
            name: "conditions"
            widget: "object"
            fields:
              - {
                  label: "Montant de la caution (ex: 500 €)",
                  name: "caution",
                  widget: "string",
                }
              - {
                  label: "Montant de l'acompte / arrhes (ex: 30% à la réservation)",
                  name: "acompte",
                  widget: "string",
                }
              - label: "Pièces obligatoires à fournir"
                name: "documentsRequis"
                widget: "list"
                field: { label: "Document requis", widget: "string" }

  # =========================================================================
  # 9. CONFIGURATION DU MOT DU MAIRE (OPTION PDF / CARD)
  # =========================================================================
  - name: "mot_du_maire_page"
    label: "Le Mot du Maire"
    delete: false
    files:
      - name: "mot_du_maire_content"
        label: "Édition du message & Archives"
        file: "src/data/motDuMaire.json"
        format: "json"
        fields:
          - {
              label: "Titre de l'édition actuelle",
              name: "titreActuel",
              widget: "string",
            }
          - {
              label: "Date ou Période (ex: Juin 2026)",
              name: "periodeActuelle",
              widget: "string",
            }
          - {
              label: "Le fichier PDF officiel",
              name: "pdfActuel",
              widget: "file",
            }
          - {
              label: "Résumé ou Édito court (Optionnel)",
              name: "resumeCourt",
              widget: "text",
              required: false,
            }
          - label: "Archives & Anciens Bulletins"
            name: "archives"
            widget: "list"
            summary: "{{fields.date}} - {{fields.titre}}"
            fields:
              - {
                  label: "Date du bulletin (ex: Janvier 2026)",
                  name: "date",
                  widget: "string",
                }
              - {
                  label: "Titre du bulletin archivé",
                  name: "titre",
                  widget: "string",
                }
              - {
                  label: "Fichier PDF archivé",
                  name: "lienPdf",
                  widget: "file",
                }

  # =========================================================================
  # 10. CONFIGURATION DES COMPTES-RENDUS
  # =========================================================================
  - name: "comptes_rendus_data"
    label: "Comptes-rendus du Conseil"
    delete: false
    editor:
      preview: false
    files:
      - file: "src/data/comptesRendus.json"
        label: "Liste des Comptes-rendus"
        name: "comptes_rendus"
        fields:
          - label: "Délibérations Municipales"
            name: "liste"
            widget: "list"
            summary: "{{fields.titre}} ({{fields.date}})"
            fields:
              - {
                  label: "Titre du compte-rendu",
                  name: "titre",
                  widget: "string",
                  placeholder: "Ex: Compte-rendu du Conseil Municipal",
                }
              - {
                  label: "Date de publication",
                  name: "date",
                  widget: "string",
                  placeholder: "Ex: 14/04/2026",
                }
              - {
                  label: "Fichier PDF officiel",
                  name: "fichier",
                  widget: "file",
                  media_folder: "public/documents/comptes-rendus",
                  public_folder: "documents/comptes-rendus",
                }

  # =========================================================================
  # 11. CONFIGURATION DES BANDEAUX ALERTES
  # =========================================================================
  - name: "alertes_commune"
    label: "Gestion des Alertes"
    delete: false
    editor:
      preview: false
    files:
      - file: "src/data/alerte.json"
        label: "Bandeau d'alerte du site"
        name: "alerte_configuration"
        fields:
          - {
              label: "Activer le bandeau sur le site ?",
              name: "actif",
              widget: "boolean",
              default: true,
            }
          - {
              label: "Type d'alerte",
              name: "type",
              widget: "select",
              options: ["info", "urgence"],
              default: "info",
            }
          - {
              label: "Message à afficher",
              name: "message",
              widget: "string",
              placeholder: "Ex: Travaux Grande Rue : Circulation alternée.",
            }
          - {
              label: "Lien optionnel (ex: /mot-du-maire)",
              name: "lien",
              widget: "string",
              required: false,
              placeholder: "Laisser vide si aucun lien",
            }
